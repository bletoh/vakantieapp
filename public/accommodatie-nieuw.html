<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nieuw accommodatievoorstel — Vakantieplanner</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">

  <a class="back-link" href="/accommodaties.html">← Terug naar accommodatie</a>

  <div class="postcard-header">
    <div>
      <div class="eyebrow">Vakantieplanner</div>
      <h1>Nieuw voorstel</h1>
    </div>
  </div>

  <form class="page-form" id="form">
    <label for="added_by">Je naam</label>
    <input type="text" id="added_by" required>

    <label for="title">Naam van de plek</label>
    <input type="text" id="title" required placeholder="Bijv. Casa Azul, centrum Lissabon">

    <label for="url">Link naar de listing (Booking.com / Airbnb / TripAdvisor / anders)</label>
    <input type="text" id="url" placeholder="https://...">

    <label for="notes">Notities (optioneel)</label>
    <textarea id="notes" placeholder="Prijs, aantal slaapkamers, waarom leuk..."></textarea>

    <div class="actions-row">
      <button type="submit" class="btn btn-primary">Voorstel toevoegen</button>
      <a class="btn btn-outline" href="/accommodaties.html">Annuleren</a>
    </div>
    <div class="error-msg" id="error"></div>
  </form>

</div>

<script src="/js/common.js"></script>
<script src="/js/accommodatie-nieuw.js"></script>
</body>
</html>
