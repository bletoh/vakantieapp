<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nieuw agenda-item — Vakantieplanner</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">

  <a class="back-link" href="/agenda.html">← Terug naar agenda</a>

  <div class="postcard-header">
    <div>
      <div class="eyebrow">Vakantieplanner</div>
      <h1>Nieuw agenda-item</h1>
    </div>
  </div>

  <form class="page-form" id="form">
    <label for="date">Datum</label>
    <input type="date" id="date" required>

    <label for="time">Tijd (optioneel)</label>
    <input type="time" id="time">

    <label for="title">Titel</label>
    <input type="text" id="title" required placeholder="Bijv. Ontbijt op het terras">

    <label for="activity_id">Koppel aan activiteit (optioneel)</label>
    <select id="activity_id">
      <option value="">— geen —</option>
    </select>

    <label for="description">Omschrijving (optioneel)</label>
    <textarea id="description"></textarea>

    <div class="actions-row">
      <button type="submit" class="btn btn-primary">Item toevoegen</button>
      <a class="btn btn-outline" href="/agenda.html">Annuleren</a>
    </div>
    <div class="error-msg" id="error"></div>
  </form>

</div>

<script src="/js/common.js"></script>
<script src="/js/agenda-nieuw.js"></script>
</body>
</html>
