<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Onze vakantie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand" id="brand"></a>
    <button class="edit-toggle" id="editToggle" type="button" aria-pressed="false">
      <span class="edit-toggle-icon">✎</span><span class="edit-toggle-label">Bewerken</span>
    </button>
  </header>

  <section class="hero" id="hero"></section>

  <nav class="tabs" id="tabs" aria-label="Onderdelen"></nav>

  <main class="panel" id="panel">
    <div class="loading">Laden…</div>
  </main>

  <footer class="footer" id="footer"></footer>

  <div class="edit-banner" id="editBanner">
    <span>Bewerkmodus — tik op tekst om aan te passen</span>
    <button type="button" id="editDone">Klaar</button>
  </div>

  <!-- Item bewerken -->
  <dialog class="sheet" id="itemDialog">
    <form method="dialog" id="itemForm">
      <div class="sheet-head">
        <h2 id="itemDialogTitle">Optie bewerken</h2>
        <button type="button" class="icon-btn" data-close aria-label="Sluiten">✕</button>
      </div>
      <div class="sheet-body">
        <div class="img-field" id="itemImageField"></div>
        <label>Titel<input name="title" required maxlength="120"></label>
        <label>Ondertitel<input name="subtitle" maxlength="160"></label>
        <div class="row-2">
          <label>Prijs<input name="price" maxlength="60"></label>
          <label>Score
            <select name="rating">
              <option value="">Geen</option>
              <option value="5">★★★★★</option>
              <option value="4">★★★★</option>
              <option value="3">★★★</option>
              <option value="2">★★</option>
              <option value="1">★</option>
            </select>
          </label>
        </div>
        <label>Beschrijving<textarea name="body" rows="4"></textarea></label>
        <div class="row-2">
          <label>Pluspunten <small>(één per regel)</small><textarea name="pros" rows="3"></textarea></label>
          <label>Minpunten <small>(één per regel)</small><textarea name="cons" rows="3"></textarea></label>
        </div>
        <label>Link<input name="link" type="url" inputmode="url" placeholder="https://…"></label>
      </div>
      <div class="sheet-foot">
        <button type="button" class="btn ghost" data-close>Annuleren</button>
        <button type="submit" class="btn primary">Opslaan</button>
      </div>
    </form>
  </dialog>

  <!-- Afbeelding kiezen -->
  <dialog class="sheet small" id="imageDialog">
    <div class="sheet-head">
      <h2>Afbeelding</h2>
      <button type="button" class="icon-btn" data-close aria-label="Sluiten">✕</button>
    </div>
    <div class="sheet-body">
      <label class="btn primary block file-btn">
        📷 Foto uploaden
        <input type="file" accept="image/*" id="imageFile" hidden>
      </label>
      <div class="divider"><span>of</span></div>
      <label>Plak een afbeeldingslink<input type="url" id="imageUrl" inputmode="url" placeholder="https://…/foto.jpg"></label>
      <button type="button" class="btn block" id="imageUrlSave">Link gebruiken</button>
      <button type="button" class="btn ghost danger block" id="imageRemove">Afbeelding verwijderen</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/js/app.js"></script>
</body>
</html>
