<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nieuw wachtwoord · Vakantieplanner</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="/vendor/inter/index.css">
  <style>
    :root { --bg: #fff; --ink: #222; --muted: #6a6a6a; --line: #e2e2e2; --brand: #e0245e; --bad: #c13515; --good: #008a05; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121212; --ink: #f2f2f2; --muted: #a3a3a3; --line: #333; --brand: #ff5c8a; --bad: #ff7a66; --good: #4cc26a; color-scheme: dark; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 'Inter Variable', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 420px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 1.5rem; letter-spacing: -.02em; margin: 0 0 6px; }
    p { margin: 0 0 16px; color: var(--muted); }
    label { display: grid; gap: 6px; font-weight: 600; font-size: .875rem; margin-bottom: 14px; }
    input { font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); }
    input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
    button { width: 100%; font: inherit; font-weight: 600; padding: 12px 16px; border: 0; border-radius: 10px; background: #e0245e; color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; }
    .error { color: var(--bad); font-weight: 500; }
    .ok { color: var(--good); font-weight: 600; }
    a { color: var(--brand); }
  </style>
</head>
<body>
  <main>
    <h1>Nieuw wachtwoord</h1>
    <p>Kies een nieuw wachtwoord voor de Vakantieplanner. Daarna ben je meteen ingelogd, en op andere apparaten uitgelogd.</p>
    <form id="f" novalidate>
      <label>Nieuw wachtwoord<input id="pw" type="password" autocomplete="new-password" minlength="8" required placeholder="Minstens 8 tekens"></label>
      <label>Nog een keer<input id="pw2" type="password" autocomplete="new-password" minlength="8" required></label>
      <p class="error" id="err" hidden></p>
      <button type="submit">Wachtwoord opslaan</button>
    </form>
    <p class="ok" id="done" hidden>Gelukt! Je wordt doorgestuurd naar de app…</p>
  </main>
  <script>
    (() => {
      const token = location.pathname.split('/').pop();
      // De code meteen uit de adresbalk (en de geschiedenis) halen.
      history.replaceState(null, '', '/reset');
      const f = document.getElementById('f');
      const err = document.getElementById('err');
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = document.getElementById('pw').value;
        err.hidden = true;
        if (pw.length < 8) { err.textContent = 'Kies een wachtwoord van minstens 8 tekens.'; err.hidden = false; return; }
        if (pw !== document.getElementById('pw2').value) { err.textContent = 'De twee wachtwoorden zijn niet gelijk.'; err.hidden = false; return; }
        const btn = f.querySelector('button');
        btn.disabled = true;
        const res = await fetch('/api/auth/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password: pw }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { err.textContent = data.error || 'Er ging iets mis.'; err.hidden = false; btn.disabled = false; return; }
        f.hidden = true;
        document.getElementById('done').hidden = false;
        setTimeout(() => { location.href = '/'; }, 1200);
      });
    })();
  </script>
</body>
</html>
